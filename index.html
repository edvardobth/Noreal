<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>noreal – AI камера</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: black; overflow: hidden; height: 100vh; width: 100vw; }
    #container { position: relative; width: 100%; height: 100%; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    canvas { pointer-events: none; }
    .controls { position: absolute; bottom: 40px; left: 0; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px; z-index: 10; }
    #zoomSlider { width: 80%; }
    #captureBtn { width: 70px; height: 70px; border-radius: 50%; background: white; opacity: 0.9; font-size: 16px; border: none; }
    #lunarIndicator { position: absolute; top: 60px; align-self: center; font-size: 30px; color: gold; display: none; }
    #progressContainer { position: absolute; bottom: 150px; width: 100%; display: none; justify-content: center; }
    #progressBar { width: 60%; height: 6px; background: rgba(255,255,255,0.3); border-radius: 3px; overflow: hidden; }
    #progressFill { width: 0%; height: 100%; background: #4caf50; transition: width 0.2s; }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="previewCanvas"></canvas>
    <div class="controls">
      <span id="lunarIndicator">🌕</span>
      <input type="range" id="zoomSlider" min="1" max="100" value="1" step="1">
      <button id="captureBtn">Снять</button>
    </div>
    <div id="progressContainer">
      <div id="progressBar"><div id="progressFill"></div></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
  <script type="module">
    const MODEL_URL = 'https://huggingface.co/qualcomm/Real-ESRGAN-lite/resolve/main/model.json';
    let model = null;

    const video = document.getElementById('video');
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    const zoomSlider = document.getElementById('zoomSlider');
    const captureBtn = document.getElementById('captureBtn');
    const lunarIndicator = document.getElementById('lunarIndicator');
    const progressContainer = document.getElementById('progressContainer');
    const progressFill = document.getElementById('progressFill');

    async function setupCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 4096 }, height: { ideal: 3072 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play();

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      requestAnimationFrame(updatePreview);
    }

    let currentZoom = 1;
    zoomSlider.addEventListener('input', (e) => {
      currentZoom = parseFloat(e.target.value);
    });

    function updatePreview() {
      const w = video.videoWidth;
      const h = video.videoHeight;
      const cropW = w / currentZoom;
      const cropH = h / currentZoom;
      const offsetX = (w - cropW) / 2;
      const offsetY = (h - cropH) / 2;

      ctx.drawImage(video, offsetX, offsetY, cropW, cropH, 0, 0, canvas.width, canvas.height);

      if (currentZoom >= 5 && isMoonVisible()) {
        lunarIndicator.style.display = 'block';
      } else {
        lunarIndicator.style.display = 'none';
      }
      requestAnimationFrame(updatePreview);
    }

    function isMoonVisible() {
      const imageData = ctx.getImageData(
        canvas.width * 0.3, canvas.height * 0.3,
        canvas.width * 0.4, canvas.height * 0.4
      );
      const data = imageData.data;
      let sumBrightness = 0;
      for (let i = 0; i < data.length; i += 4) {
        sumBrightness += (data[i] + data[i+1] + data[i+2]) / 3;
      }
      const avg = sumBrightness / (data.length / 4);
      return avg > 80 && avg < 200;
    }

    async function loadModel() {
      if (!model) {
        model = await tf.loadGraphModel(MODEL_URL);
      }
    }

    captureBtn.addEventListener('click', async () => {
      if (!model) {
        alert('Модель ещё загружается. Подождите секунду.');
        return;
      }
      progressContainer.style.display = 'flex';
      captureBtn.disabled = true;

      const w = video.videoWidth;
      const h = video.videoHeight;
      const cropW = w / currentZoom;
      const cropH = h / currentZoom;
      const offX = (w - cropW) / 2;
      const offY = (h - cropH) / 2;

      const captureCanvas = document.createElement('canvas');
      captureCanvas.width = cropW;
      captureCanvas.height = cropH;
      const capCtx = captureCanvas.getContext('2d');
      capCtx.drawImage(video, offX, offY, cropW, cropH, 0, 0, cropW, cropH);

      const imageTensor = tf.browser.fromPixels(captureCanvas)
        .toFloat().div(255.0).expandDims(0);

      progressFill.style.width = '0%';
      const steps = 20;
      for (let i = 1; i <= steps; i++) {
        await new Promise(r => setTimeout(r, 250 + Math.random() * 500));
        progressFill.style.width = `${(i/steps)*100}%`;
      }

      const start = performance.now();
      const output = model.execute(imageTensor);
      const squeezed = output.squeeze();
      let enhancedTensor = squeezed.mul(255).clipByValue(0,255).cast('int32');
      const resultCanvas = document.createElement('canvas');
      [resultCanvas.width, resultCanvas.height] = [squeezed.shape[1], squeezed.shape[0]];
      await tf.browser.toPixels(enhancedTensor, resultCanvas);
      const end = performance.now();
      console.log(`Обработка заняла: ${(end-start)/1000} сек`);

      const link = document.createElement('a');
      link.download = `noreal_${Date.now()}.png`;
      link.href = resultCanvas.toDataURL('image/png');
      link.click();

      imageTensor.dispose();
      output.dispose();
      enhancedTensor.dispose();
      progressContainer.style.display = 'none';
      captureBtn.disabled = false;
    });

    setupCamera();
    loadModel();
  </script>
</body>
</html>
